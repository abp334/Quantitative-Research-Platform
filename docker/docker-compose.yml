services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quant_research
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quant_research"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://quant:quant@db:5432/quant_research
      DATABASE_URL_SYNC: postgresql://quant:quant@db:5432/quant_research
      DATA_DIR: /data/archive
      MODELS_DIR: /models
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost,http://frontend
      OPTUNA_TRIALS: "20"
      DEBUG: "false"
    ports:
      - "8000:8000"
    volumes:
      - ../archive:/data/archive:ro
      - modeldata:/models
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  modeldata:
